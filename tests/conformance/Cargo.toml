[package]
name = "godmode-conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Conformance testing harness for godmode"

[dependencies]
godmode-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
similar = { workspace = true }
slashcrux = { workspace = true }
cruxx-core = { workspace = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conformance_bench"
harness = false

[[bin]]
name = "run-conformance"
path = "src/bin/run_conformance.rs"
