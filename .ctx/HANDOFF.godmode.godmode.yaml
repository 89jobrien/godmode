- id: pre-commit-gate-pipeline-fix
  name: pre-commit-gate-pipeline-fix
  priority: P1
  status: completed
  title: Fix pre-commit-gate deadlock on fmt+commit pipelines
  description: |-
    Naive `str contains "git commit"` matched anywhere in the full command
    string, causing `cargo fmt --all && git commit -m "..."` to be blocked
    before the fmt step could run — a deadlock with no escape.
    Fixed by splitting on pipeline operators (&&, ;, |) and checking whether
    any segment starts with `git commit` or `git -C ... commit`.
    Shipped in eebcf4b, discovered while working in agentlint repo.
