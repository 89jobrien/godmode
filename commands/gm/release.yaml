name: release
template: dev
pipeline: release
prompt: |
  Workspace release pipeline from health assessment through release notes and commit.
  Abort when a required readiness or verification step fails; surface what needs fixing.
stepInstructions:
  health-score: Assess repository health and report release blockers.
  dep-audit: Audit dependency security, licenses, and maintenance risks.
  code-review: Review release changes across all severity levels in one pass.
  verification-before-completion: Require every project gate to pass before release work continues.
  changelog: Update the changelog from verified changes.
  release-notes: Produce human-facing release notes from the canonical change set.
  cap: Commit and push the release artifacts only after all prior steps pass.
allowedTools:
  - Bash
  - Read
  - Edit
  - Write
  - Glob
  - Grep
maxTurns: 40
