name: feature
template: dev
pipeline: feature
prompt: |
  Full feature lifecycle from idea to committed code.
  Do not write code until the user has approved the proposed approach. Pause before
  task-driven development and report the plan path first.
stepInstructions:
  brainstorm: >-
    Explore context, ask clarifying questions one at a time, and propose 2-3 named approaches.
    Wait for explicit user approval before continuing.
  context-map: Map relevant files, dependencies, tests, reference patterns, and risks.
  writing-plans: >-
    Scaffold the plan file and break the work into 2-5 minute tasks with a failing test,
    implementation, GREEN verification, and commit cycle.
  task-management: Record the approved plan as an ordered task graph.
  task-driven-development: Execute the plan task by task using strict RED/GREEN/refactor cycles.
  code-review: Review all severity levels in one pass and fix accepted findings.
  verification-before-completion: Require every project gate to pass before shipping.
  cap: Commit and push only after verification succeeds.
  pr-author: Create the pull request when requested.
  merge: Merge only after required checks and approvals pass.
allowedTools:
  - Bash
  - Read
  - Edit
  - Write
  - Glob
  - Grep
maxTurns: 50
