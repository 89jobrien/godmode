meta:
  name: PLAN
  description: "Standard godmode feature loop: brainstorm → plan → implement → verify"
  vars:
    - name: feature
      required: true
      # Short slug for the feature, used in task IDs (e.g. "priority-filter")
    - name: crate
      required: true
      # Primary crate being changed (e.g. "godmode-core")
    - name: prefix
      default: "t"
      # Task ID prefix (default: t → t1, t2, ...)

tasks:
  - id: "{{prefix}}1"
    title: "Brainstorm: design {{feature}}"
    status: pending
    depends_on: []
    crate_name: "{{crate}}"
    priority: high
    tags: ["design", "brainstorm", "godmode"]
    notes: "Use godmode:brainstorm to compare approaches before coding"

  - id: "{{prefix}}2"
    title: "Plan: write implementation steps for {{feature}}"
    status: pending
    depends_on: ["{{prefix}}1"]
    crate_name: "{{crate}}"
    priority: high
    tags: ["plan", "context-map", "godmode"]
    notes: "Create a context map and write a plan with exact files and validation commands"

  - id: "{{prefix}}3"
    title: "Implement: {{feature}} (TDD — red)"
    status: pending
    depends_on: ["{{prefix}}2"]
    crate_name: "{{crate}}"
    run: "cargo nextest run -p {{crate}}"
    priority: high
    tags: ["tdd", "red", "test"]
    notes: "Write failing tests first; do not touch implementation until tests are red"

  - id: "{{prefix}}4"
    title: "Implement: {{feature}} (TDD — green)"
    status: pending
    depends_on: ["{{prefix}}3"]
    crate_name: "{{crate}}"
    run: "cargo nextest run -p {{crate}}"
    priority: high
    tags: ["tdd", "green", "implementation"]
    notes: "Write the minimum implementation to make the focused tests pass"

  - id: "{{prefix}}5"
    title: "Verify: clippy + nextest + fmt for {{feature}}"
    status: pending
    depends_on: ["{{prefix}}4"]
    crate_name: "{{crate}}"
    run: >-
      cargo clippy --workspace -- -D warnings &&
      cargo nextest run --workspace &&
      cargo fmt --all --check
    priority: high
    tags: ["verification", "clippy", "nextest", "fmt"]
    notes: "Run workspace gates; fix warnings and formatting before claiming completion"
