[package]
name = "godmode-cli"
description = "CLI for godmode: task graph management, parallel agent dispatch, session handoff, and release automation."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/godmode-cli"
readme = "README.md"
keywords = ["task-graph", "agent", "workflow", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "godmode"
path = "src/main.rs"

[dependencies]
godmode-core = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
clap_complete_nushell = "4"
serde_json = { workspace = true }
anyhow = { workspace = true }
miette = { workspace = true, features = ["fancy"] }

[features]
default = []
test-utils = []

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile = "3"
