# Example governance policy — production search agent
# Load with: GovernancePolicy from serde_yaml::from_str

name: production-search-agent
allowed_tools:
  - search_documents
  - query_database
  - summarize
blocked_tools:
  - shell_exec
  - delete_record
  - drop_table
blocked_patterns:
  - "(?i)(api[_-]?key|secret|password)\\s*[:=]"
  - "(?i)(drop|truncate|delete from)\\s+\\w+"
  - "(?i)curl\\s+.*-d\\s+"
max_calls_per_request: 25
require_human_approval:
  - send_email
  - publish_report
