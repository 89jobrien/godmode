[workspace]
members = ["crates/godmode-core", "crates/godmode-cli", "tests/conformance"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Joseph O'Brien"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/godmode"

[workspace.dependencies]
godmode-core = { path = "crates/godmode-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
slashcrux = "0.1.2"
cruxx-core = { version = "0.2.5", features = ["tokio-runtime"] }
rayon = "1"
petgraph = { version = "0.6", features = ["stable_graph"] }
similar = "2"
tracing = "0.1"
tracing-test = "0.2"
