name: Conformance

# TODO(#110): Add tag release artifacts and scheduled bounded fuzzing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

jobs:
  conformance-rust:
    name: rust conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: build godmode-cli
        run: cargo build -p godmode-cli

      - name: cargo nextest run (godmode-core conformance)
        run: cargo nextest run -p godmode-core --test conformance

  conformance-skill-index:
    name: skill index completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install nushell
        run: |
          curl -sL https://github.com/nushell/nushell/releases/download/0.111.0/nu-0.111.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin nu-0.111.0-x86_64-unknown-linux-gnu/nu
          nu --version

      - name: check skill index
        run: nu scripts/check-skill-index.nu

      - name: check command projections
        run: cargo test -p godmode-conformance

  scheduled-skill-evaluation:
    name: bounded skill evaluation
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: run repeated skill evaluation within budget
        run: >-
          cargo run -p godmode-cli -- eval run rustqual-workspace
          --results evaluations/fixtures/rustqual-workspace-results.json
          --repeat 3 --max-cases 9 --max-cost-usd 0.05

      - name: enforce pass-rate and cost thresholds
        run: >-
          cargo run -p godmode-cli -- eval status rustqual-workspace
          --min-pass-rate 0.80 --max-cost-usd 0.05
