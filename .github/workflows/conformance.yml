name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0

jobs:
  conformance-rust:
    name: rust conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: build godmode-cli
        run: cargo build -p godmode-cli

      - name: cargo nextest run (godmode-core conformance)
        run: cargo nextest run -p godmode-core --test conformance
